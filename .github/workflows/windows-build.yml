name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '>=22.12.0 <23'
          architecture: x64
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare ChatGPT SDK
        run: npm run prepare:sdk

      - name: Run tests
        run: npm test

      - name: Build Windows portable app
        run: npm run build

      - name: Build Windows installer
        run: npm run build:installer

      - name: Upload Windows portable app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Synora-code-Windows-x64-portable
          path: |
            dist/Synora-code-*-win32-x64/
            !dist/Synora-code-*-win32-x64/data/**
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

      - name: Upload Windows installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Synora-code-Windows-x64-installer
          path: installer-output/Synora-code-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
